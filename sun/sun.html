<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sun — Solar System</title>
  <link rel="stylesheet" href="./sun.css" />

  <!-- Import map: tells the browser where to fetch the libraries.
       No build tools needed — this works as a plain static page.
       This page uses the WebGL build of Three.js with custom GLSL shaders. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="planetCanvas" aria-label="3D view of the Sun"></canvas>

  <header class="page-title">
    <h1>Sun</h1>
    <p>Our star</p>
  </header>

  <!-- Tiny FPS readout; toggled from the control panel -->
  <div id="fpsMeter" class="fps-meter" aria-hidden="true">— fps</div>

  <!-- Shown until the first frame is rendered -->
  <div id="loading" class="overlay">
    <div class="overlay-panel">
      <div class="pulse-dot"></div>
      <div class="overlay-title">Loading Sun</div>
    </div>
  </div>

  <!-- Shown only if something fails (for example a shader compile error) -->
  <div id="error" class="overlay error hidden">
    <div class="overlay-panel">
      <div class="pulse-dot"></div>
      <div class="overlay-title">Something went wrong</div>
      <p class="overlay-text" id="errorText"></p>
    </div>
  </div>

  <script type="module" src="./sun.js"></script>
</body>
</html>
